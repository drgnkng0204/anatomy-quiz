<title>解剖過去問クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap">
<style>
/* Layout: one-column study app. Home = mode list; quiz = sticky progress bar, serif question card, sticky action bar. */
:root{
  --bg:#f1f4f6;--surface:#ffffff;--ink:#15202a;--muted:#5b6a77;--line:#d8e0e6;
  --accent:#1b6d8c;--accent-ink:#ffffff;--accent-soft:#dbecf3;
  --ok:#217a4e;--ok-soft:#dcf1e6;--ng:#b5382c;--ng-soft:#f7e0dd;
  --blank:#fff0c4;--blank-ink:#6f5200;--shadow:0 1px 2px rgba(20,40,60,.08);
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e151b;--surface:#18222b;--ink:#e7edf2;--muted:#92a2b0;--line:#2a3743;
    --accent:#5db4d4;--accent-ink:#07222d;--accent-soft:#1a3340;
    --ok:#53c48b;--ok-soft:#163325;--ng:#ef8075;--ng-soft:#3a1e1b;
    --blank:#3a3113;--blank-ink:#f2d57d;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151b;--surface:#18222b;--ink:#e7edf2;--muted:#92a2b0;--line:#2a3743;
  --accent:#5db4d4;--accent-ink:#07222d;--accent-soft:#1a3340;
  --ok:#53c48b;--ok-soft:#163325;--ng:#ef8075;--ng-soft:#3a1e1b;
  --blank:#3a3113;--blank-ink:#f2d57d;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 28px;min-height:100vh;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--serif);font-size:1.7rem;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:1.05rem;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.top{display:flex;align-items:center;gap:10px}
.top .grow{flex:1;min-width:0}
.back{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:0 14px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat b{display:block;font-size:1.5rem;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:68px;box-shadow:var(--shadow)}
.mode:active{background:var(--accent-soft)}
.mode .t{flex:1;min-width:0}
.mode .t b{display:block;font-size:1.02rem}
.mode .t span{display:block;font-size:.84rem;color:var(--muted)}
.mode .chev{color:var(--muted);font-size:1.3rem}
.badge{background:var(--ng);color:#fff;border-radius:999px;font-size:.8rem;min-width:26px;text-align:center;padding:2px 9px;font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:10px;align-self:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;min-height:42px;padding:0 16px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.grp{font-size:.82rem;color:var(--muted);margin:4px 0 0;letter-spacing:.04em}
select,input[type=number]{width:100%;min-height:48px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted);min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 18px;width:100%}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ng{background:var(--ng);border-color:var(--ng);color:#fff}
.btn[disabled]{opacity:.45}
.quizbar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px;display:flex;align-items:center;gap:10px}
.quizbar .prog{flex:1;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.quizbar small{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:.78rem;border-radius:8px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums;font-weight:500}
.tag.rev{background:var(--ng-soft);color:var(--ng)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.q{font-family:var(--serif);font-weight:500;font-size:1.18rem;line-height:2;margin:0;overflow-wrap:anywhere;word-break:normal}
.blank{display:inline-block;min-width:2.1em;text-align:center;background:var(--blank);color:var(--blank-ink);border-radius:6px;padding:0 .35em;margin:0 .1em;font-family:var(--sans);font-size:.88em;font-weight:700;line-height:1.6}
.blank.filled{background:var(--ok-soft);color:var(--ok);font-family:var(--serif);font-weight:700}
.ans{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.arow{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:baseline}
.arow .l{background:var(--blank);color:var(--blank-ink);border-radius:8px;text-align:center;font-weight:700;font-size:.9rem}
.arow .ja{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.arow .la{display:block;color:var(--muted);font-size:.9rem;font-style:italic;overflow-wrap:anywhere}
.sibs{display:flex;flex-direction:column;gap:8px}
.sibs h3{font-size:.84rem;color:var(--muted);margin:0;font-weight:500}
.actions{position:sticky;bottom:0;z-index:5;background:var(--bg);padding-block:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.actions.one{grid-template-columns:1fr}
.skip{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px;align-self:center}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,20,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.sheet .hd{display:flex;gap:8px;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;padding:9px 18px;border-radius:999px;font-weight:700;font-size:.9rem;color:#fff;pointer-events:none}
.toast.ok{background:var(--ok)}.toast.ng{background:var(--ng)}
.big{font-family:var(--serif);font-size:3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.missed{display:flex;flex-direction:column;gap:8px}
.missed button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:baseline;min-height:48px}
.missed .qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.9rem}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:.78rem}
.tw{overflow-x:auto}
textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:.8rem;font-family:ui-monospace,Menlo,monospace}
.tag.saving{background:var(--line);color:var(--muted)}.tag.err{background:var(--ng-soft);color:var(--ng)}
.wl{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.wl .q{font-size:1rem;line-height:1.9}.printhead{display:none}
@media print{
  :root{color-scheme:light}
  body,.wrap,.wl,.panel{background:#fff!important;color:#000!important}
  .noprint,.quizbar,.actions,.toast,.syncst{display:none!important}
  .printhead{display:block}.wrap{padding:0;min-height:0;max-width:none}
  .wl{border:1px solid #888!important;border-radius:0;break-inside:avoid;page-break-inside:avoid;margin-bottom:8px;box-shadow:none}
  .wl .q,.arow .ja{color:#000!important}.tag{background:#eee!important;color:#000!important}
  .blank.filled{background:#e6e6e6!important;color:#000!important}.arow .l{background:#ddd!important;color:#000!important}
  .arow .la{color:#333!important}
}
.urow{display:flex;gap:8px;align-items:stretch}.urow .mode{flex:1;min-width:0}.urow .back{min-height:68px}
td.best{font-weight:700;color:var(--accent)}.mode[disabled]{opacity:.5}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
@media (min-width:768px){.q{font-size:1.3rem}.wrap{padding-block:28px 40px}h1{font-size:2rem}}
@media (prefers-reduced-motion:no-preference){.mode,.btn,.chip{transition:background .12s}}
</style>

<div id="app" class="wrap"></div>
<div id="layer"></div>
<div id="asklayer"></div>

<script>
const DATA=/*DATA*/null;
(function(){
"use strict";
const QALL=DATA.q,SECS=DATA.secs,byId={},secIdx={};
QALL.forEach(q=>{byId[q.id]=q});SECS.forEach((s,i)=>{secIdx[s.id]=i});
const CATS=["くびと体幹の浅層","上肢","体壁","下肢","骨盤","その他"];
const CATDESC={"くびと体幹の浅層":"§1–10","上肢":"§11–25","体壁":"§26–34","下肢":"§53–63","骨盤":"§64–71","その他":"胸腔・腹腔・あたま・脳など"};
const secOf=q=>q.sec?q.sec.split("-")[0]:"";
const secTitle=id=>(secIdx[id]!==undefined?SECS[secIdx[id]].t:"");
function catOf(q){const s=secOf(q);if(!(s in secIdx))return"その他";const n=parseInt(s,10);
  if(n<=10)return CATS[0];if(n<=25)return CATS[1];if(n<=34)return CATS[2];
  if(n>=53&&n<=63)return CATS[3];if(n>=64&&n<=71)return CATS[4];return CATS[5]}
function idParts(id){const m=id.match(/^(\d+)(再?)-(\d+)([a-z]?)$/);return m?{y:m[1],sai:m[2]==="再",n:+m[3],s:m[4]}:{y:"",sai:false,n:0,s:""}}
const yearKey=q=>{const p=idParts(q.id);return p.y+(p.sai?"再":"")};
const yearLabel=k=>(2000+parseInt(k,10))+"年度"+(k.endsWith("再")?" 再試":"");
const cmpId=(a,b)=>{const x=idParts(a),y=idParts(b);return x.n-y.n||x.s.localeCompare(y.s)};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const nrm=s=>String(s||"").replace(/\s+/g,"").toLowerCase();
const ordKey=id=>{const p=idParts(id);return[parseInt(p.y,10)||0,p.sai?1:0,p.n,p.s]};
const cmpFull=(a,b)=>{const x=ordKey(a),y=ordKey(b);for(let i=0;i<3;i++)if(x[i]!==y[i])return x[i]-y[i];return x[3].localeCompare(y[3])};
const canon={},members={};
QALL.forEach(q=>{const c=q.c||q.id;canon[q.id]=c;(members[c]||(members[c]=[])).push(q.id)});
for(const c in members)members[c].sort(cmpFull);
const Q=QALL.filter(q=>canon[q.id]===q.id);
function normRec(R){const out={};for(const id in R){const c=canon[id]||id,r=R[id];
  if(!out[c])out[c]=Object.assign({},r);else{const o=out[c],n=(o.n||0)+(r.n||0);if((r.t||0)>(o.t||0))Object.assign(o,r);o.n=n}}return out}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const CLOUD=/*CLOUDCFG*/{"projectId":"","apiKey":""}/*END*/;
const cloudOn=()=>!!(CLOUD.projectId&&CLOUD.apiKey);
const fsBase=()=>CLOUD.base||"https://firestore.googleapis.com/v1/projects/"+CLOUD.projectId+"/databases/(default)/documents";
const keyQ=()=>"key="+encodeURIComponent(CLOUD.apiKey);
const rid=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return[...a].map(b=>"abcdefghijklmnopqrstuvwxyz0123456789"[b%36]).join("")};
async function fsGet(p){const r=await fetch(fsBase()+"/"+p+"?"+keyQ());if(r.status===404)return null;if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function fsList(p){const r=await fetch(fsBase()+"/"+p+"?pageSize=300&"+keyQ());if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function fsSet(p,o){const fields={};for(const k in o)fields[k]={stringValue:String(o[k])};
  const r=await fetch(fsBase()+"/"+p+"?"+keyQ(),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})});if(!r.ok)throw new Error("HTTP "+r.status)}
const fv=(d,k)=>d&&d.fields&&d.fields[k]&&d.fields[k].stringValue!=null?d.fields[k].stringValue:"";
const LOGMAX=4000;
let users=[],usersState="load",usersErr="",cur=null,rec={},log=[];
let dirty=false,flushing=false,flushT=0,syncState="ok";
const answered=id=>!!rec[canon[id]||id];
function metricsOf(R,L){const m={seen:0,c:0,w:0,tot:L.length,ok:L.reduce((a,x)=>a+x[1],0),cats:{}};
  CATS.forEach(c=>m.cats[c]={s:0,c:0,a:0,k:0});
  Q.forEach(q=>{const r=R[q.id];if(r){m.seen++;const b=m.cats[catOf(q)];b.s++;if(r.s==="c"){m.c++;b.c++}else if(r.s==="w")m.w++}});
  L.forEach(x=>{const q=byId[x[0]];if(q){const b=m.cats[catOf(q)];b.a++;b.k+=x[1]}});return m}
function mergeData(R,L,rd){const rec2=Object.assign({},R),rr=(rd&&rd.rec)||{};
  for(const id in rr){if(!rec2[id]||(rr[id].t||0)>(rec2[id].t||0))rec2[id]=rr[id]}
  const seen=new Set(),log2=[];[].concat(L,(rd&&rd.log)||[]).forEach(x=>{const k=x[0]+"|"+x[2];if(!seen.has(k)){seen.add(k);log2.push(x)}});
  log2.sort((a,b)=>a[2]-b[2]);return{rec:rec2,log:log2.slice(-LOGMAX)}}
const SYNCTXT={ok:"保存済み",saving:"保存中…",err:"未保存(再試行します)"};
function setSync(st){syncState=st;document.querySelectorAll(".syncst").forEach(e=>{e.className="tag syncst "+st;e.textContent=SYNCTXT[st]})}
const syncTag=()=>`<span class="tag syncst ${syncState}">${SYNCTXT[syncState]}</span>`;
function save(){dirty=true;setSync("saving");clearTimeout(flushT);flushT=setTimeout(flush,1200)}
async function flush(){clearTimeout(flushT);if(!cur||!dirty)return true;if(flushing)return false;
  flushing=true;const u=cur;dirty=false;setSync("saving");let ok=true;
  try{const doc=await fsGet("records/"+u.pid);
    if(cur!==u)throw new Error("user changed");
    if(doc){try{const m=mergeData(rec,log,JSON.parse(fv(doc,"data")));rec=normRec(m.rec);log=m.log}catch(e){}}
    const now=new Date().toISOString(),st=metricsOf(rec,log);
    await fsSet("records/"+u.pid,{data:JSON.stringify({rec,log}),updated:now});
    await fsSet("profiles/"+u.pid,{name:u.name,stats:JSON.stringify(st),updated:now,hidden:"0"});
    u.st=st;u.updated=now;setSync(dirty?"saving":"ok")}
  catch(e){dirty=true;ok=false;setSync("err");clearTimeout(flushT);flushT=setTimeout(flush,8000)}
  finally{flushing=false}
  if(ok&&dirty){clearTimeout(flushT);flushT=setTimeout(flush,300)}
  return ok}
function parseUser(d){let st=null;try{st=JSON.parse(fv(d,"stats"))}catch(e){}
  return{pid:d.name.split("/").pop(),name:fv(d,"name")||"?",updated:fv(d,"updated"),st}}
async function loadUsers(){usersState="load";if(view==="users"||view==="ranking")render();
  try{const j=await fsList("profiles");users=(j.documents||[]).map(parseUser).filter(u=>u.st);
    users.sort((a,b)=>a.name.localeCompare(b.name,"ja",{numeric:true}));
    if(cur){const c=users.find(u=>u.pid===cur.pid);if(c&&!dirty&&!flushing){cur.st=c.st}}
    usersState="ok";usersErr=""}
  catch(e){usersState="err";usersErr=String(e.message||e)}
  if(view==="users"||view==="ranking")render()}
async function pickUser(pid){
  if(cur&&dirty){const ok=await flush();if(!ok){toast(false,"未保存の記録があります。接続を確認してください");return}}
  view="loading";render();
  try{const doc=await fsGet("records/"+pid);let R={},L=[];
    let changed=false;
    if(doc){try{const o=JSON.parse(fv(doc,"data"));R=o.rec||{};L=o.log||[];const n0=Object.keys(R).length;R=normRec(R);changed=Object.keys(R).length!==n0}catch(e){}}
    cur=users.find(u=>u.pid===pid)||cur;rec=R;log=L;dirty=false;setSync("ok");S=null;stack=[];view="home";render();if(changed)save()}
  catch(e){view="users";toast(false,"読み込めませんでした");render()}}
async function createUser(name){const pid=rid(20),now=new Date().toISOString(),st=metricsOf({},[]);
  try{await fsSet("records/"+pid,{data:'{"rec":{},"log":[]}',updated:now});
    await fsSet("profiles/"+pid,{name,stats:JSON.stringify(st),updated:now,hidden:"0"});
    users.push({pid,name,updated:now,st});users.sort((a,b)=>a.name.localeCompare(b.name,"ja",{numeric:true}));F.newname="";toast(true,"追加しました");render()}
  catch(e){toast(false,"追加できませんでした")}}
async function renameUser(u,name){try{await fsSet("profiles/"+u.pid,{name,stats:JSON.stringify(u.st),updated:u.updated||new Date().toISOString(),hidden:"0"});u.name=name;
    users.sort((a,b)=>a.name.localeCompare(b.name,"ja",{numeric:true}));toast(true,"変更しました")}catch(e){toast(false,"変更できませんでした")}}
function legacyUsers(){const out=[];try{const g=k=>localStorage.getItem(k),us=JSON.parse(g("akq2.users")||"null");
    const one=(name,rk,lk)=>{let R={},L=[];try{R=JSON.parse(g(rk)||"{}");L=JSON.parse(g(lk)||"[]")}catch(e){}if(Object.keys(R).length)out.push({name,rec:R,log:L})};
    if(us)us.forEach(u=>one(u.name,"akq2.u"+u.id+".rec","akq2.u"+u.id+".log"));else one("以前の記録","akq.rec","akq.log")}catch(e){}return out}
function record(id,ok){
  id=canon[id]||id;const r=rec[id]||(rec[id]={s:"",need:0,n:0,t:0});r.n++;r.t=Date.now();
  if(ok){if(r.s==="w"){r.need--;if(r.need<=0){r.s="c";r.need=0}}else r.s="c"}
  else if(r.s!=="w"){r.s="w";r.need=2}
  log.push([id,ok?1:0,r.t]);if(log.length>LOGMAX)log=log.slice(-LOGMAX);save();
}
const wrongIds=()=>Q.filter(q=>rec[q.id]&&rec[q.id].s==="w").map(q=>q.id);

function parseAns(t){const m={},order=[];String(t||"").split("\n").forEach(l=>{
  const x=l.match(/^\s*([A-Z])\s*[:：]\s*(.*)$/);
  if(x){m[x[1]]=x[2].trim();order.push(x[1])}else if(order.length&&l.trim()){m[order[order.length-1]]+=" "+l.trim()}});
  return{m,order,raw:String(t||"")}}
function fmtQ(q,rev){const ja=parseAns(q.ja).m;
  return esc(q.q).replace(/\[\s*([A-Z])\s*\]/g,(_,k)=>rev&&ja[k]?`<span class="blank filled">${esc(ja[k])}</span>`:`<span class="blank">${k}</span>`)}

let view="users",ask=null,S=null,F={edit:"",uname:"",newname:"",year:"",count:20,custom:"",from:0,to:SECS.length-1,num:"all"},stack=[],resetArm=false,toastT=0;
const $app=document.getElementById("app"),$layer=document.getElementById("layer"),$ask=document.getElementById("asklayer");

function stats(){const seen=Object.keys(rec).length;let c=0,w=0;for(const k in rec){if(rec[k].s==="c")c++;else if(rec[k].s==="w")w++}
  const tot=log.length,ok=log.reduce((a,x)=>a+x[1],0);return{seen,c,w,tot,ok}}

function home(){const st=stats(),rate=st.tot?Math.round(st.ok/st.tot*100)+"%":"–",wn=st.w;
  return `<div class="top"><div class="grow"><h1>解剖過去問クイズ</h1><p class="sub">${Q.length}問 · 解答済み ${st.seen}問</p></div><button class="back" data-act="go" data-v="users">${esc(cur.name)} ⇄</button></div><div class="meta">${syncTag()}</div>
  <div class="stats3"><div class="stat"><b>${st.tot}</b><span>解答回数</span></div><div class="stat"><b>${rate}</b><span>正答率</span></div><div class="stat"><b>${wn}</b><span>復習中</span></div></div>
  <div class="modes">
  <button class="mode" data-act="random"><span class="t"><b>ランダム(全問)</b><span>全問題をシャッフルして出題</span></span><span class="chev">›</span></button>
  ${mode("year","年度別","年度を選び、問題番号順に解く(再試は別枠)")}
  ${mode("count","問題数を指定","指定した問題数をランダムに出題")}
  ${mode("section","セクション範囲","§の範囲を指定してランダムに出題")}
  ${mode("cat","部位別","くびと体幹の浅層・上肢・体壁・下肢・骨盤・その他")}
  <button class="mode" data-act="wrong"><span class="t"><b>不正解のみ</b><span>2回正解すると克服扱いになります</span></span>${wn?`<span class="badge">${wn}</span>`:""}<span class="chev">›</span></button>
  </div>
  <div class="chips" style="justify-content:center"><button class="link" data-act="go" data-v="stats">成績</button><button class="link" data-act="go" data-v="ranking">ユーザー比較</button></div>`}
function mode(v,t,d){return `<button class="mode" data-act="go" data-v="${v}"><span class="t"><b>${t}</b><span>${d}</span></span><span class="chev">›</span></button>`}
function head(t){return `<div class="top"><button class="back" data-act="go" data-v="home">‹ 戻る</button><h2 class="grow">${t}</h2></div>`}

function vUsers(){const h=`<div><h1>解剖過去問クイズ</h1><p class="sub">ユーザーを選んでください。記録はクラウド(Firebase)に保存されます。</p></div>`;
  if(!cloudOn())return h+`<div class="panel"><p>このバージョンはクラウドに接続できません。GitHub で公開しているアプリを開いてください。</p></div>`;
  if(usersState==="load"&&!users.length)return h+`<p class="empty">読み込み中…</p>`;
  if(usersState==="err"&&!users.length)return h+`<p class="empty">読み込めませんでした(${esc(usersErr)})</p><button class="btn" data-act="rk-reload">再読み込み</button>`;
  const rows=users.map(u=>{const m=u.st,rate=m.tot?Math.round(m.ok/m.tot*100)+"%":"–";
    if(F.edit===u.pid)return `<div class="panel"><label class="f">名前<input id="uname" type="text" maxlength="12" value="${esc(F.uname)}" data-bind="uname"></label><div class="row2"><button class="btn" data-act="uedit" data-id="0">キャンセル</button><button class="btn pri" data-act="usave">保存</button></div></div>`;
    return `<div class="urow"><button class="mode" data-act="pick" data-id="${esc(u.pid)}"><span class="t"><b>${esc(u.name)}</b><span>解答済み ${m.seen}問 · 正答率 ${rate} · 復習中 ${m.w}</span></span><span class="chev">›</span></button><button class="back" data-act="uedit" data-id="${esc(u.pid)}" aria-label="名前を変更">名前</button></div>`}).join("");
  return h+`<div class="modes">${rows}</div>
  ${users.length<20?`<div class="panel"><label class="f">新しいユーザー<input id="newname" type="text" maxlength="12" placeholder="名前" value="${esc(F.newname)}" data-bind="newname"></label><button class="btn" data-act="adduser">ユーザーを追加</button></div>`:""}
  <button class="link" data-act="go" data-v="ranking">ユーザー比較</button>`}
function vRanking(){const pct=(a,b)=>b?Math.round(a/b*100):null,key=F.rsort||"rate",me=cur&&cur.pid;
  const rows=users.map(u=>({u,rate:pct(u.st.ok,u.st.tot),seen:u.st.seen,c:u.st.c,tot:u.st.tot}));
  rows.sort((a,b)=>(b[key]??-1)-(a[key]??-1));
  const top=rows.length?rows[0][key]:null;
  const body=!cloudOn()?`<p class="empty">クラウドに接続できません。</p>`:usersState==="load"?`<p class="empty">読み込み中…</p>`:usersState==="err"?`<p class="empty">読み込めませんでした(${esc(usersErr)})</p>`:!rows.length?`<p class="empty">ユーザーがいません。</p>`:
   `<div class="panel tw"><table><tr><th>名前</th><th>解答済</th><th>正解扱</th><th>回数</th><th>正答率</th></tr>${rows.map(r=>`<tr><td>${esc(r.u.name)}${r.u.pid===me?' <span class="tag">あなた</span>':""}</td><td>${r.seen}</td><td>${r.c}</td><td>${r.tot}</td><td class="${r[key]===top&&rows.length>1?"best":""}">${r.rate==null?"–":r.rate+"%"}</td></tr>`).join("")}</table></div>
   <div class="panel tw"><h2>部位別の正答率</h2><table><tr><th>名前</th>${CATS.map(c=>`<th>${c.replace("くびと体幹の浅層","くび体幹")}</th>`).join("")}</tr>${rows.map(r=>`<tr><td>${esc(r.u.name)}</td>${CATS.map(c=>{const b=(r.u.st.cats||{})[c];const v=b?pct(b.k,b.a):null;return `<td>${v==null?"–":v+"%"}</td>`}).join("")}</tr>`).join("")}</table></div>
   <div class="panel tw"><h2>部位別の解答済み(問)</h2><table><tr><th>名前</th>${CATS.map(c=>`<th>${c.replace("くびと体幹の浅層","くび体幹")}</th>`).join("")}</tr>${rows.map(r=>`<tr><td>${esc(r.u.name)}</td>${CATS.map(c=>`<td>${(r.u.st.cats||{})[c]?r.u.st.cats[c].s:0}</td>`).join("")}</tr>`).join("")}</table></div>`;
  return `<div class="top"><button class="back" data-act="go" data-v="${cur?"home":"users"}">‹ 戻る</button><h2 class="grow">ユーザー比較</h2></div>
  <div class="row2"><label class="f">並び順<select id="rsort" data-bind="rsort">${[["rate","正答率"],["seen","解答済み"],["c","正解扱い"],["tot","解答回数"]].map(o=>`<option value="${o[0]}" ${key===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></label><button class="btn" data-act="rk-reload" style="align-self:end">更新</button></div>${body}
  <p class="sub">正答率は累計の解答回数で計算しています。</p>`}
function wrongByCat(){const by={};CATS.forEach(c=>by[c]=[]);wrongIds().forEach(i=>by[catOf(byId[i])].push(i));return by}
function vWrong(){const by=wrongByCat(),n=CATS.reduce((a,c)=>a+by[c].length,0);
  return head("不正解のみ")+`<div class="meta">${syncTag()}</div>
  ${n?`<div class="modes"><button class="mode" data-act="wrong-go" data-c=""><span class="t"><b>ランダム</b><span>不正解の全${n}問をシャッフルして出題</span></span><span class="chev">›</span></button></div>
  <p class="grp">部位別に解き直す</p><div class="modes">${CATS.map(c=>`<button class="mode" data-act="wrong-go" data-c="${c}" ${by[c].length?"":"disabled"}><span class="t"><b>${c}</b><span>${by[c].length}問</span></span><span class="chev">›</span></button>`).join("")}</div>
  <button class="btn" data-act="go" data-v="wronglist">不正解問題の一覧を見る(PDF保存)</button>`:`<p class="empty">不正解の問題はありません。</p>`}`}
function vWrongList(){const by=wrongByCat(),cat=F.wcat||"",cats=cat?[cat]:CATS;
  const items=[];cats.forEach(c=>by[c].slice().sort((a,b)=>{const x=secIdx[secOf(byId[a])]??999,y=secIdx[secOf(byId[b])]??999;return x-y||cmpFull(a,b)}).forEach(i=>items.push(i)));
  const total=CATS.reduce((a,c)=>a+by[c].length,0),d=new Date().toLocaleDateString("ja-JP");
  const item=i=>{const q=byId[i],r=rec[i],a=parseAns(q.ja),l=parseAns(q.la);
    return `<div class="wl"><div class="meta"><span class="tag">${esc(q.id)}</span>${q.page?`<span class="tag">p.${esc(q.page)}</span>`:""}${q.sec&&q.sec!=="不明"?`<span class="tag">§${esc(q.sec)} ${esc(secTitle(secOf(q)))}</span>`:""}<span class="tag rev">あと${r?r.need:2}回</span></div>
    <p class="q">${fmtQ(q,true)}</p><div class="ans">${a.order.length?a.order.map(k=>`<div class="arow"><span class="l">${k}</span><span><span class="ja">${esc(a.m[k])}</span>${l.m[k]?`<span class="la">${esc(l.m[k])}</span>`:""}</span></div>`).join(""):`<div class="ja">${esc(a.raw)}</div>`}</div></div>`};
  return `<div class="top noprint"><button class="back" data-act="go" data-v="wrongmode">‹ 戻る</button><h2 class="grow">不正解の一覧</h2></div>
  <div class="chips noprint"><button class="chip ${cat?"":"on"}" data-act="wl-cat" data-c="">すべて(${total})</button>${CATS.map(c=>`<button class="chip ${cat===c?"on":""}" data-act="wl-cat" data-c="${c}">${c}(${by[c].length})</button>`).join("")}</div>
  <button class="btn pri noprint" data-act="wl-print" ${items.length?"":"disabled"}>PDFで保存(印刷)</button>
  <p class="sub noprint">「PDFで保存」を押し、印刷画面で「PDFとして保存」を選んでください。iPhone・iPad では、プレビューをピンチアウトして共有ボタンから保存できます。ホーム画面から開いたアプリで動かないときは、Safari で開いてください。</p>
  <div class="printhead"><h2>解剖過去問 不正解一覧 · ${esc(cur.name)}</h2><p class="sub">${d} · ${cat?esc(cat)+" · ":""}${items.length}問</p></div>
  ${items.length?items.map(item).join(""):`<p class="empty">該当する問題はありません。</p>`}`}
function vYear(){const ys={};Q.forEach(q=>{const k=yearKey(q);ys[k]=(ys[k]||0)+1});
  const keys=Object.keys(ys),tot=keys.filter(k=>!k.endsWith("再")).sort(),sai=keys.filter(k=>k.endsWith("再")).sort();
  const chips=a=>a.map(k=>`<button class="chip ${F.year===k?"on":""}" data-act="year" data-k="${k}">${2000+parseInt(k,10)}</button>`).join("");
  return head("年度別")+`<div class="panel"><p class="grp" style="margin:0">総試</p><div class="chips">${chips(tot)}</div><p class="grp">再試</p><div class="chips">${chips(sai)}</div></div>
  <button class="btn pri" data-act="start-year" ${F.year?"":"disabled"}>${F.year?yearLabel(F.year)+"("+ys[F.year]+"問)を問題番号順に解く":"年度を選んでください"}</button>`}
function vCount(){const n=F.custom?Math.max(1,parseInt(F.custom,10)||1):F.count;
  return head("問題数を指定")+`<div class="panel"><div class="chips">${[10,20,30,50,100].map(x=>`<button class="chip ${!F.custom&&F.count===x?"on":""}" data-act="count" data-n="${x}">${x}問</button>`).join("")}</div>
  <label class="f">自由入力(1〜${Q.length})<input id="custom" type="number" inputmode="numeric" min="1" max="${Q.length}" value="${esc(F.custom)}" data-bind="custom" placeholder="例: 75"></label></div>
  <button class="btn pri" data-act="start-count">${Math.min(n,Q.length)}問をランダムに解く</button>`}
function secPool(){const a=Math.min(F.from,F.to),b=Math.max(F.from,F.to);return Q.filter(q=>{const i=secIdx[secOf(q)];return i!==undefined&&i>=a&&i<=b}).map(q=>q.id)}
function vSection(){const opts=sel=>SECS.map((s,i)=>`<option value="${i}" ${sel===i?"selected":""}>§${s.id} ${esc(s.t)}</option>`).join("");
  const pool=secPool();
  return head("セクション範囲")+`<div class="panel"><label class="f">開始<select id="from" data-bind="from">${opts(F.from)}</select></label>
  <label class="f">終了<select id="to" data-bind="to">${opts(F.to)}</select></label>
  <label class="f">問題数<select id="num" data-bind="num">${["all",10,20,30,50].map(x=>`<option value="${x}" ${String(F.num)===String(x)?"selected":""}>${x==="all"?"範囲内すべて":x+"問"}</option>`).join("")}</select></label>
  <p class="sub">範囲内の問題: ${pool.length}問</p></div>
  <button class="btn pri" data-act="start-section" ${pool.length?"":"disabled"}>ランダムに解く</button>`}
function vCat(){const cnt={};CATS.forEach(c=>cnt[c]=0);Q.forEach(q=>cnt[catOf(q)]++);
  return head("部位別")+`<div class="modes">${CATS.map(c=>`<button class="mode" data-act="cat" data-c="${c}"><span class="t"><b>${c}</b><span>${CATDESC[c]} · ${cnt[c]}問</span></span><span class="chev">›</span></button>`).join("")}</div>`}

function vStats(){const by={};CATS.forEach(c=>by[c]={t:0,s:0,c:0,w:0});
  Q.forEach(q=>{const b=by[catOf(q)];b.t++;const r=rec[q.id];if(r){b.s++;if(r.s==="c")b.c++;else if(r.s==="w")b.w++}});
  const st=stats();
  return head("成績 · "+esc(cur.name))+`<div class="meta">${syncTag()}</div><div class="stats3"><div class="stat"><b>${st.seen}<small style="font-size:.9rem">/${Q.length}</small></b><span>解答済み</span></div><div class="stat"><b>${st.c}</b><span>正解扱い</span></div><div class="stat"><b>${st.w}</b><span>復習中</span></div></div>
  <div class="panel tw"><table><tr><th>部位</th><th>問題</th><th>解答済</th><th>正解扱</th><th>復習中</th></tr>${CATS.map(c=>{const b=by[c];return `<tr><td>${c}</td><td>${b.t}</td><td>${b.s}</td><td>${b.c}</td><td>${b.w}</td></tr>`}).join("")}</table></div>
  ${legacyPanel()}`}
function legacyPanel(){const L=legacyUsers();if(!L.length)return"";
  return `<div class="panel"><h2>この端末に残っている以前の記録</h2><p class="sub">以前このブラウザに保存されていた記録です。現在のユーザー「${esc(cur.name)}」の記録に統合してクラウドへ保存します。統合しても、この端末の記録は削除されません。</p>${L.map((l,i)=>`<button class="btn" data-act="legacy" data-i="${i}">${esc(l.name)}(${Object.keys(l.rec).length}問)を統合</button>`).join("")}</div>`}


function cardHTML(st){const q=byId[canon[st.id]||st.id],r=rec[q.id],a=parseAns(q.ja),l=parseAns(q.la);
  const sec=secOf(q);
  let h=`<div class="card"><div class="meta"><span class="tag">${esc(q.id)}</span>${q.page?`<span class="tag">p.${esc(q.page)}</span>`:""}${q.sec&&q.sec!=="不明"?`<span class="tag" title="${esc(secTitle(sec))}">§${esc(q.sec)} ${esc(secTitle(sec))}</span>`:""}${(members[q.id]||[]).length>1?`<span class="tag">出題 ${[...new Set(members[q.id].map(i=>{const p=idParts(i);return(2000+parseInt(p.y,10))+(p.sai?"再":"")}))].join("・")}</span>`:""}${r&&r.s==="w"?`<span class="tag rev">復習中 あと${r.need}回</span>`:""}</div>
  <p class="q">${fmtQ(q,st.rev)}</p>`;
  if(st.rev){h+=`<div class="ans">`;
    if(a.order.length)h+=a.order.map(k=>`<div class="arow"><span class="l">${k}</span><span><span class="ja">${esc(a.m[k])}</span>${l.m[k]?`<span class="la">${esc(l.m[k])}</span>`:""}</span></div>`).join("");
    else h+=`<div class="ja" style="white-space:pre-wrap">${esc(a.raw)}</div>`;
    h+=`</div>`}
  h+=`</div>`;
  const own=new Set(members[q.id]||[q.id]),sibs=[...new Set((members[q.id]||[q.id]).flatMap(i=>byId[i].sib).map(x=>canon[x]||x))].filter(x=>!own.has(x)).sort(cmpFull);
  if(sibs.length)h+=`<div class="sibs"><h3>類題</h3><div class="chips">${sibs.map(s=>`<button class="chip" data-act="sib" data-id="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`;
  return h}

function vQuiz(){const st=S.card,n=S.queue.length;
  return `<div class="quizbar"><button class="back" data-act="quit" aria-label="終了">✕</button><div class="prog"><div class="bar"><i style="width:${S.i/n*100}%"></i></div></div><small>${S.i+1} / ${n}</small></div>
  <div class="meta"><span class="tag">${esc(S.label)}</span>${syncTag()}</div>
  ${cardHTML(st)}
  ${st.rev?`<div class="actions"><button class="btn ng" data-act="ng">✕ 不正解</button><button class="btn ok" data-act="ok">○ 正解</button></div>`
    :`<div class="actions one"><button class="btn pri" data-act="reveal">答えを見る</button></div><button class="skip" data-act="skip">スキップ</button>`}`}

function vResult(){const n=S.res.length,ok=S.res.filter(x=>x.ok).length,miss=S.res.filter(x=>!x.ok);
  return `<div class="top"><h2 class="grow">結果 · ${esc(S.label)}</h2></div>
  <div class="panel" style="align-items:center;text-align:center"><div class="big">${ok}<small style="font-size:1.2rem"> / ${n}</small></div><div class="bar" style="width:100%"><i style="width:${n?ok/n*100:0}%"></i></div><p class="sub">正答率 ${n?Math.round(ok/n*100):0}%</p></div>
  ${miss.length?`<div class="missed"><h2>不正解 ${miss.length}問</h2>${miss.map(x=>`<button data-act="open" data-id="${esc(x.id)}"><span class="tag">${esc(x.id)}</span><span class="qt">${esc(byId[x.id].q.replace(/\s+/g," "))}</span></button>`).join("")}</div>`:`<p class="empty">全問正解です。</p>`}
  <div class="modes">${miss.length?`<button class="btn pri" data-act="redo-miss">不正解だけもう一度</button>`:""}<button class="btn" data-act="redo">同じ条件で最初から</button><button class="btn" data-act="go" data-v="home">ホームへ</button></div>`}

function render(){const v={wrongmode:vWrong,wronglist:vWrongList,loading:()=>`<p class="empty">読み込み中…</p>`,ranking:vRanking,users:vUsers,home,year:vYear,count:vCount,section:vSection,cat:vCat,stats:vStats,quiz:vQuiz,result:vResult}[view];
  const y=window.scrollY;$app.innerHTML=v();if(view==="home"||view==="quiz"||view==="result")window.scrollTo(0,0);else window.scrollTo(0,y)}
function sheetRender(){if(!stack.length){$layer.innerHTML="";return}const st=stack[stack.length-1];
  $layer.innerHTML=`<div class="sheet" data-act="sheet-bg"><div class="in" role="dialog" aria-label="類題"><div class="hd"><button class="back" data-act="sheet-back">${stack.length>1?"‹ 戻る":"閉じる"}</button>${stack.length>1?`<button class="back" data-act="sheet-close">閉じる</button>`:""}</div>
  ${cardHTML(st)}
  ${st.done?`<p class="sub" style="text-align:center">記録しました</p>`:st.rev?`<div class="actions" style="position:static;background:none"><button class="btn ng" data-act="s-ng">✕ 不正解</button><button class="btn ok" data-act="s-ok">○ 正解</button></div>`:`<button class="btn pri" data-act="s-reveal">答えを見る</button>`}</div></div>`}

function toast(ok,t){clearTimeout(toastT);let e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e)}
  e.className="toast "+(ok?"ok":"ng");e.textContent=t;e.hidden=false;toastT=setTimeout(()=>{e.hidden=true},900)}

function launch(label,pool,make){const all=pool(false).length,nw=pool(true).length;
  if(!all){toast(false,"該当する問題がありません");return}ask={label,pool,make,all,nw};askRender()}
function askRender(){if(!ask){$ask.innerHTML="";return}
  $ask.innerHTML=`<div class="sheet" data-act="ask-bg"><div class="in" role="dialog" aria-label="開始方法"><h2>${esc(ask.label)}</h2>
  <button class="mode" data-act="ask-go" data-skip="1" ${ask.nw?"":"disabled"}><span class="t"><b>続きから</b><span>${ask.nw?`未回答の問題だけ出題(${ask.nw}問)`:"すべて解答済みです"}</span></span><span class="chev">›</span></button>
  <button class="mode" data-act="ask-go" data-skip="0"><span class="t"><b>最初から</b><span>解答済みも含めて出題(${ask.all}問) · 記録は消えません</span></span><span class="chev">›</span></button>
  <button class="btn" data-act="ask-cancel">キャンセル</button></div></div>`}
function begin(label,rebuild){const ids=rebuild();S={label,queue:ids.slice(),i:0,res:[],card:null,rebuild};
  if(!S.queue.length){view="home";render();return}S.card={id:S.queue[0],rev:false};view="quiz";render()}
function advance(){S.i++;if(S.i>=S.queue.length){view="result"}else S.card={id:S.queue[S.i],rev:false};render()}
function grade(ok){const id=S.card.id;record(id,ok);S.res.push({id,ok});toast(ok,ok?"○ 記録しました":"✕ 記録しました");advance()}
const take=(ids,n)=>shuffle(ids).slice(0,n);
const allIds=()=>Q.map(q=>q.id);

document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,d=t.dataset;
  if(a==="sheet-bg"){if(e.target===t){stack=[];sheetRender()}return}
  switch(a){
  case"go":view=d.v;render();if(view==="ranking"||view==="users")loadUsers();break;
  case"rk-reload":loadUsers();break;
  case"random":launch("ランダム(全問)",sk=>allIds().filter(i=>!sk||!answered(i)),shuffle);break;
  case"ask-bg":if(e.target===t){ask=null;askRender()}break;
  case"ask-cancel":ask=null;askRender();break;
  case"ask-go":{const k=ask,sk=d.skip==="1";ask=null;askRender();if(!k)break;begin(k.label+(sk?"(続き)":""),()=>k.make(k.pool(sk)));break}
  case"pick":pickUser(d.id);break;
  case"uedit":F.edit=d.id==="0"?"":d.id;{const u=users.find(x=>x.pid===F.edit);F.uname=u?u.name:""}render();break;
  case"usave":{const u=users.find(x=>x.pid===F.edit),n=F.uname.trim();F.edit="";render();if(u&&n&&n!==u.name)renameUser(u,n).then(render);break}
  case"adduser":{const n=(F.newname||"").trim();if(!n){toast(false,"名前を入力してください");break}createUser(n);break}
  case"legacy":{const l=legacyUsers()[+d.i];if(!l)break;const m=mergeData(rec,log,l);rec=normRec(m.rec);log=m.log;save();toast(true,"統合しました");render();break}
  case"year":F.year=d.k;render();break;
  case"start-year":{const y=F.year;launch(yearLabel(y),sk=>Q.filter(q=>yearKey(q)===y&&(!sk||!answered(q.id))).map(q=>q.id),ids=>ids.slice().sort(cmpId));break}
  case"count":F.count=+d.n;F.custom="";render();break;
  case"start-count":{const n=F.custom?Math.max(1,parseInt(F.custom,10)||1):F.count;launch(Math.min(n,Q.length)+"問ランダム",sk=>allIds().filter(i=>!sk||!answered(i)),ids=>take(ids,n));break}
  case"start-section":{const a1=Math.min(F.from,F.to),b1=Math.max(F.from,F.to),num=F.num;
    launch("§"+SECS[a1].id+"–§"+SECS[b1].id,sk=>secPool().filter(i=>!sk||!answered(i)),ids=>take(ids,num==="all"?ids.length:+num));break}
  case"cat":{const c=d.c;launch(c,sk=>Q.filter(q=>catOf(q)===c&&(!sk||!answered(q.id))).map(q=>q.id),shuffle);break}
  case"wrong":{if(!wrongIds().length){toast(true,"不正解の問題はありません");break}view="wrongmode";render();break}
  case"wrong-go":{const c=d.c;if(!wrongIds().filter(i=>!c||catOf(byId[i])===c).length)break;begin(c?"不正解 · "+c:"不正解 · ランダム",()=>shuffle(wrongIds().filter(i=>!c||catOf(byId[i])===c)));break}
  case"wl-cat":F.wcat=d.c;render();break;
  case"wl-print":try{window.print()}catch(e){toast(false,"印刷画面を開けませんでした")}break;
  case"reveal":S.card.rev=true;render();window.scrollTo(0,0);break;
  case"ok":grade(true);break;case"ng":grade(false);break;
  case"skip":advance();break;
  case"quit":if(S.res.length){view="result";render()}else{view="home";render()}break;
  case"sib":stack.push({id:d.id,rev:false,done:false});sheetRender();break;
  case"open":stack=[{id:d.id,rev:false,done:false}];sheetRender();break;
  case"sheet-back":stack.pop();sheetRender();break;
  case"sheet-close":stack=[];sheetRender();break;
  case"s-reveal":stack[stack.length-1].rev=true;sheetRender();break;
  case"s-ok":case"s-ng":{const st=stack[stack.length-1];record(st.id,a==="s-ok");st.done=true;toast(a==="s-ok",(a==="s-ok"?"○":"✕")+" 記録しました");sheetRender();break}
  case"redo":{const rb=S.rebuild,l=S.label;if(rb().length)begin(l,rb);else{view="home";render()}break}
  case"redo-miss":{const ids=S.res.filter(x=>!x.ok).map(x=>x.id);begin("不正解だけ",()=>shuffle(ids));break}
  }});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.bind==="uname"){F.uname=t.value;return}if(t.dataset.bind==="newname"){F.newname=t.value;return}if(t.dataset.bind==="custom"){F.custom=t.value;const b=document.querySelector('[data-act="start-count"]');
  if(b){const n=F.custom?Math.max(1,parseInt(F.custom,10)||1):F.count;b.textContent=Math.min(n,Q.length)+"問をランダムに解く"}
  document.querySelectorAll('[data-act="count"]').forEach(c=>c.classList.toggle("on",!F.custom&&+c.dataset.n===F.count))}});
document.addEventListener("change",e=>{const t=e.target,b=t.dataset.bind;if(!b||b==="custom"||b==="uname"||b==="newname")return;F[b]=(b==="num"||b==="rsort")?t.value:+t.value;render()});
document.addEventListener("keydown",e=>{if(view!=="quiz"||e.target.matches("input,textarea,select"))return;
  if(!S.card.rev&&(e.key==="Enter"||e.key===" ")){e.preventDefault();S.card.rev=true;render()}
  else if(S.card.rev&&(e.key==="1"||e.key==="o")){grade(true)}else if(S.card.rev&&(e.key==="2"||e.key==="x")){grade(false)}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&cur&&dirty)flush()});
render();if(cloudOn())loadUsers();
})();
</script>
