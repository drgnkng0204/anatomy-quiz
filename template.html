<title>解剖過去問クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap">
<style>
/* Layout: one-column study app. Home = mode list; quiz = sticky progress bar, serif question card, sticky action bar. */
:root{
  --bg:#f1f4f6;--surface:#ffffff;--ink:#15202a;--muted:#5b6a77;--line:#d8e0e6;
  --accent:#1b6d8c;--accent-ink:#ffffff;--accent-soft:#dbecf3;
  --ok:#217a4e;--ok-soft:#dcf1e6;--ng:#b5382c;--ng-soft:#f7e0dd;
  --blank:#fff0c4;--blank-ink:#6f5200;--shadow:0 1px 2px rgba(20,40,60,.08);
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e151b;--surface:#18222b;--ink:#e7edf2;--muted:#92a2b0;--line:#2a3743;
    --accent:#5db4d4;--accent-ink:#07222d;--accent-soft:#1a3340;
    --ok:#53c48b;--ok-soft:#163325;--ng:#ef8075;--ng-soft:#3a1e1b;
    --blank:#3a3113;--blank-ink:#f2d57d;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151b;--surface:#18222b;--ink:#e7edf2;--muted:#92a2b0;--line:#2a3743;
  --accent:#5db4d4;--accent-ink:#07222d;--accent-soft:#1a3340;
  --ok:#53c48b;--ok-soft:#163325;--ng:#ef8075;--ng-soft:#3a1e1b;
  --blank:#3a3113;--blank-ink:#f2d57d;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 28px;min-height:100vh;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--serif);font-size:1.7rem;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:1.05rem;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.top{display:flex;align-items:center;gap:10px}
.top .grow{flex:1;min-width:0}
.back{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:0 14px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat b{display:block;font-size:1.5rem;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:68px;box-shadow:var(--shadow)}
.mode:active{background:var(--accent-soft)}
.mode .t{flex:1;min-width:0}
.mode .t b{display:block;font-size:1.02rem}
.mode .t span{display:block;font-size:.84rem;color:var(--muted)}
.mode .chev{color:var(--muted);font-size:1.3rem}
.badge{background:var(--ng);color:#fff;border-radius:999px;font-size:.8rem;min-width:26px;text-align:center;padding:2px 9px;font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:10px;align-self:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;min-height:42px;padding:0 16px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.grp{font-size:.82rem;color:var(--muted);margin:4px 0 0;letter-spacing:.04em}
select,input[type=number]{width:100%;min-height:48px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted);min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 18px;width:100%}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ng{background:var(--ng);border-color:var(--ng);color:#fff}
.btn[disabled]{opacity:.45}
.quizbar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px;display:flex;align-items:center;gap:10px}
.quizbar .prog{flex:1;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.quizbar small{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:.78rem;border-radius:8px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums;font-weight:500}
.tag.rev{background:var(--ng-soft);color:var(--ng)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.q{font-family:var(--serif);font-weight:500;font-size:1.18rem;line-height:2;margin:0;overflow-wrap:anywhere;word-break:normal}
.blank{display:inline-block;min-width:2.1em;text-align:center;background:var(--blank);color:var(--blank-ink);border-radius:6px;padding:0 .35em;margin:0 .1em;font-family:var(--sans);font-size:.88em;font-weight:700;line-height:1.6}
.blank.filled{background:var(--ok-soft);color:var(--ok);font-family:var(--serif);font-weight:700}
.ans{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.arow{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:baseline}
.arow .l{background:var(--blank);color:var(--blank-ink);border-radius:8px;text-align:center;font-weight:700;font-size:.9rem}
.arow .ja{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.arow .la{display:block;color:var(--muted);font-size:.9rem;font-style:italic;overflow-wrap:anywhere}
.sibs{display:flex;flex-direction:column;gap:8px}
.sibs h3{font-size:.84rem;color:var(--muted);margin:0;font-weight:500}
.actions{position:sticky;bottom:0;z-index:5;background:var(--bg);padding-block:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.actions.one{grid-template-columns:1fr}
.skip{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px;align-self:center}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,20,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.sheet .hd{display:flex;gap:8px;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;padding:9px 18px;border-radius:999px;font-weight:700;font-size:.9rem;color:#fff;pointer-events:none}
.toast.ok{background:var(--ok)}.toast.ng{background:var(--ng)}
.big{font-family:var(--serif);font-size:3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.missed{display:flex;flex-direction:column;gap:8px}
.missed button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:baseline;min-height:48px}
.missed .qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.9rem}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:.78rem}
.tw{overflow-x:auto}
textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:.8rem;font-family:ui-monospace,Menlo,monospace}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
@media (min-width:768px){.q{font-size:1.3rem}.wrap{padding-block:28px 40px}h1{font-size:2rem}}
@media (prefers-reduced-motion:no-preference){.mode,.btn,.chip{transition:background .12s}}
</style>

<div id="app" class="wrap"></div>
<div id="layer"></div>

<script>
const DATA=/*DATA*/null;
(function(){
"use strict";
const Q=DATA.q,SECS=DATA.secs,byId={},secIdx={};
Q.forEach(q=>{byId[q.id]=q});SECS.forEach((s,i)=>{secIdx[s.id]=i});
const CATS=["くびと体幹の浅層","上肢","体壁","下肢","骨盤","その他"];
const CATDESC={"くびと体幹の浅層":"§1–10","上肢":"§11–25","体壁":"§26–34","下肢":"§53–63","骨盤":"§64–71","その他":"胸腔・腹腔・あたま・脳など"};
const secOf=q=>q.sec?q.sec.split("-")[0]:"";
const secTitle=id=>(secIdx[id]!==undefined?SECS[secIdx[id]].t:"");
function catOf(q){const s=secOf(q);if(!(s in secIdx))return"その他";const n=parseInt(s,10);
  if(n<=10)return CATS[0];if(n<=25)return CATS[1];if(n<=34)return CATS[2];
  if(n>=53&&n<=63)return CATS[3];if(n>=64&&n<=71)return CATS[4];return CATS[5]}
function idParts(id){const m=id.match(/^(\d+)(再?)-(\d+)([a-z]?)$/);return m?{y:m[1],sai:m[2]==="再",n:+m[3],s:m[4]}:{y:"",sai:false,n:0,s:""}}
const yearKey=q=>{const p=idParts(q.id);return p.y+(p.sai?"再":"")};
const yearLabel=k=>(2000+parseInt(k,10))+"年度"+(k.endsWith("再")?" 再試":"");
const cmpId=(a,b)=>{const x=idParts(a),y=idParts(b);return x.n-y.n||x.s.localeCompare(y.s)};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function load(k,d){try{const v=JSON.parse(store.get(k));return v==null?d:v}catch(e){return d}}
let rec=load("akq.rec",{}),log=load("akq.log",[]);
const save=()=>{store.set("akq.rec",JSON.stringify(rec));store.set("akq.log",JSON.stringify(log.slice(-4000)))};
function record(id,ok){
  const r=rec[id]||(rec[id]={s:"",need:0,n:0,t:0});r.n++;r.t=Date.now();
  if(ok){if(r.s==="w"){r.need--;if(r.need<=0){r.s="c";r.need=0}}else r.s="c"}
  else if(r.s!=="w"){r.s="w";r.need=2}
  log.push([id,ok?1:0,r.t]);save();
}
const wrongIds=()=>Q.filter(q=>rec[q.id]&&rec[q.id].s==="w").map(q=>q.id);

function parseAns(t){const m={},order=[];String(t||"").split("\n").forEach(l=>{
  const x=l.match(/^\s*([A-Z])\s*[:：]\s*(.*)$/);
  if(x){m[x[1]]=x[2].trim();order.push(x[1])}else if(order.length&&l.trim()){m[order[order.length-1]]+=" "+l.trim()}});
  return{m,order,raw:String(t||"")}}
function fmtQ(q,rev){const ja=parseAns(q.ja).m;
  return esc(q.q).replace(/\[\s*([A-Z])\s*\]/g,(_,k)=>rev&&ja[k]?`<span class="blank filled">${esc(ja[k])}</span>`:`<span class="blank">${k}</span>`)}

let view="home",S=null,F={year:"",count:20,custom:"",from:0,to:SECS.length-1,num:"all"},stack=[],resetArm=false,toastT=0;
const $app=document.getElementById("app"),$layer=document.getElementById("layer");

function stats(){const seen=Object.keys(rec).length;let c=0,w=0;for(const k in rec){if(rec[k].s==="c")c++;else if(rec[k].s==="w")w++}
  const tot=log.length,ok=log.reduce((a,x)=>a+x[1],0);return{seen,c,w,tot,ok}}

function home(){const st=stats(),rate=st.tot?Math.round(st.ok/st.tot*100)+"%":"–",wn=st.w;
  return `<div><h1>解剖過去問クイズ</h1><p class="sub">${Q.length}問 · 解答済み ${st.seen}問</p></div>
  <div class="stats3"><div class="stat"><b>${st.tot}</b><span>解答回数</span></div><div class="stat"><b>${rate}</b><span>正答率</span></div><div class="stat"><b>${wn}</b><span>復習中</span></div></div>
  <div class="modes">
  <button class="mode" data-act="random"><span class="t"><b>ランダム(全問)</b><span>全問題をシャッフルして出題</span></span><span class="chev">›</span></button>
  ${mode("year","年度別","年度を選び、問題番号順に解く(再試は別枠)")}
  ${mode("count","問題数を指定","指定した問題数をランダムに出題")}
  ${mode("section","セクション範囲","§の範囲を指定してランダムに出題")}
  ${mode("cat","部位別","くびと体幹の浅層・上肢・体壁・下肢・骨盤・その他")}
  <button class="mode" data-act="wrong"><span class="t"><b>不正解のみ</b><span>2回正解すると克服扱いになります</span></span>${wn?`<span class="badge">${wn}</span>`:""}<span class="chev">›</span></button>
  </div>
  <button class="link" data-act="go" data-v="stats">成績・バックアップ</button>`}
function mode(v,t,d){return `<button class="mode" data-act="go" data-v="${v}"><span class="t"><b>${t}</b><span>${d}</span></span><span class="chev">›</span></button>`}
function head(t){return `<div class="top"><button class="back" data-act="go" data-v="home">‹ 戻る</button><h2 class="grow">${t}</h2></div>`}

function vYear(){const ys={};Q.forEach(q=>{const k=yearKey(q);ys[k]=(ys[k]||0)+1});
  const keys=Object.keys(ys),tot=keys.filter(k=>!k.endsWith("再")).sort(),sai=keys.filter(k=>k.endsWith("再")).sort();
  const chips=a=>a.map(k=>`<button class="chip ${F.year===k?"on":""}" data-act="year" data-k="${k}">${2000+parseInt(k,10)}</button>`).join("");
  return head("年度別")+`<div class="panel"><p class="grp" style="margin:0">総試</p><div class="chips">${chips(tot)}</div><p class="grp">再試</p><div class="chips">${chips(sai)}</div></div>
  <button class="btn pri" data-act="start-year" ${F.year?"":"disabled"}>${F.year?yearLabel(F.year)+"("+ys[F.year]+"問)を問題番号順に解く":"年度を選んでください"}</button>`}
function vCount(){const n=F.custom?Math.max(1,parseInt(F.custom,10)||1):F.count;
  return head("問題数を指定")+`<div class="panel"><div class="chips">${[10,20,30,50,100].map(x=>`<button class="chip ${!F.custom&&F.count===x?"on":""}" data-act="count" data-n="${x}">${x}問</button>`).join("")}</div>
  <label class="f">自由入力(1〜${Q.length})<input id="custom" type="number" inputmode="numeric" min="1" max="${Q.length}" value="${esc(F.custom)}" data-bind="custom" placeholder="例: 75"></label></div>
  <button class="btn pri" data-act="start-count">${Math.min(n,Q.length)}問をランダムに解く</button>`}
function secPool(){const a=Math.min(F.from,F.to),b=Math.max(F.from,F.to);return Q.filter(q=>{const i=secIdx[secOf(q)];return i!==undefined&&i>=a&&i<=b}).map(q=>q.id)}
function vSection(){const opts=sel=>SECS.map((s,i)=>`<option value="${i}" ${sel===i?"selected":""}>§${s.id} ${esc(s.t)}</option>`).join("");
  const pool=secPool();
  return head("セクション範囲")+`<div class="panel"><label class="f">開始<select id="from" data-bind="from">${opts(F.from)}</select></label>
  <label class="f">終了<select id="to" data-bind="to">${opts(F.to)}</select></label>
  <label class="f">問題数<select id="num" data-bind="num">${["all",10,20,30,50].map(x=>`<option value="${x}" ${String(F.num)===String(x)?"selected":""}>${x==="all"?"範囲内すべて":x+"問"}</option>`).join("")}</select></label>
  <p class="sub">範囲内の問題: ${pool.length}問</p></div>
  <button class="btn pri" data-act="start-section" ${pool.length?"":"disabled"}>ランダムに解く</button>`}
function vCat(){const cnt={};CATS.forEach(c=>cnt[c]=0);Q.forEach(q=>cnt[catOf(q)]++);
  return head("部位別")+`<div class="modes">${CATS.map(c=>`<button class="mode" data-act="cat" data-c="${c}"><span class="t"><b>${c}</b><span>${CATDESC[c]} · ${cnt[c]}問</span></span><span class="chev">›</span></button>`).join("")}</div>`}

function vStats(){const by={};CATS.forEach(c=>by[c]={t:0,s:0,c:0,w:0});
  Q.forEach(q=>{const b=by[catOf(q)];b.t++;const r=rec[q.id];if(r){b.s++;if(r.s==="c")b.c++;else if(r.s==="w")b.w++}});
  const st=stats();
  return head("成績")+`<div class="stats3"><div class="stat"><b>${st.seen}<small style="font-size:.9rem">/${Q.length}</small></b><span>解答済み</span></div><div class="stat"><b>${st.c}</b><span>正解扱い</span></div><div class="stat"><b>${st.w}</b><span>復習中</span></div></div>
  <div class="panel tw"><table><tr><th>部位</th><th>問題</th><th>解答済</th><th>正解扱</th><th>復習中</th></tr>${CATS.map(c=>{const b=by[c];return `<tr><td>${c}</td><td>${b.t}</td><td>${b.s}</td><td>${b.c}</td><td>${b.w}</td></tr>`}).join("")}</table></div>
  <div class="panel"><h2>バックアップ</h2><p class="sub">記録はこの端末のブラウザに保存されます。別の端末へ移すときは、下の文字列をコピーして、移行先の欄に貼り付けて「読み込む」を押してください。</p>
  <textarea id="bk" readonly>${esc(JSON.stringify({rec,log}))}</textarea><button class="btn" data-act="copy">コピー</button>
  <textarea id="imp" placeholder="ここに貼り付け"></textarea><button class="btn" data-act="import">読み込む</button></div>
  <button class="btn ${resetArm?"ng":""}" data-act="reset">${resetArm?"本当に全記録を消去する(もう一度押す)":"記録をすべて消去"}</button>`}

function cardHTML(st){const q=byId[st.id],r=rec[q.id],a=parseAns(q.ja),l=parseAns(q.la);
  const sec=secOf(q);
  let h=`<div class="card"><div class="meta"><span class="tag">${esc(q.id)}</span>${q.page?`<span class="tag">p.${esc(q.page)}</span>`:""}${q.sec&&q.sec!=="不明"?`<span class="tag" title="${esc(secTitle(sec))}">§${esc(q.sec)} ${esc(secTitle(sec))}</span>`:""}${r&&r.s==="w"?`<span class="tag rev">復習中 あと${r.need}回</span>`:""}</div>
  <p class="q">${fmtQ(q,st.rev)}</p>`;
  if(st.rev){h+=`<div class="ans">`;
    if(a.order.length)h+=a.order.map(k=>`<div class="arow"><span class="l">${k}</span><span><span class="ja">${esc(a.m[k])}</span>${l.m[k]?`<span class="la">${esc(l.m[k])}</span>`:""}</span></div>`).join("");
    else h+=`<div class="ja" style="white-space:pre-wrap">${esc(a.raw)}</div>`;
    h+=`</div>`}
  h+=`</div>`;
  if(q.sib.length)h+=`<div class="sibs"><h3>類題</h3><div class="chips">${q.sib.map(s=>`<button class="chip" data-act="sib" data-id="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`;
  return h}

function vQuiz(){const st=S.card,n=S.queue.length;
  return `<div class="quizbar"><button class="back" data-act="quit" aria-label="終了">✕</button><div class="prog"><div class="bar"><i style="width:${S.i/n*100}%"></i></div></div><small>${S.i+1} / ${n}</small></div>
  <div class="meta"><span class="tag">${esc(S.label)}</span></div>
  ${cardHTML(st)}
  ${st.rev?`<div class="actions"><button class="btn ng" data-act="ng">✕ 不正解</button><button class="btn ok" data-act="ok">○ 正解</button></div>`
    :`<div class="actions one"><button class="btn pri" data-act="reveal">答えを見る</button></div><button class="skip" data-act="skip">スキップ</button>`}`}

function vResult(){const n=S.res.length,ok=S.res.filter(x=>x.ok).length,miss=S.res.filter(x=>!x.ok);
  return `<div class="top"><h2 class="grow">結果 · ${esc(S.label)}</h2></div>
  <div class="panel" style="align-items:center;text-align:center"><div class="big">${ok}<small style="font-size:1.2rem"> / ${n}</small></div><div class="bar" style="width:100%"><i style="width:${n?ok/n*100:0}%"></i></div><p class="sub">正答率 ${n?Math.round(ok/n*100):0}%</p></div>
  ${miss.length?`<div class="missed"><h2>不正解 ${miss.length}問</h2>${miss.map(x=>`<button data-act="open" data-id="${esc(x.id)}"><span class="tag">${esc(x.id)}</span><span class="qt">${esc(byId[x.id].q.replace(/\s+/g," "))}</span></button>`).join("")}</div>`:`<p class="empty">全問正解です。</p>`}
  <div class="modes">${miss.length?`<button class="btn pri" data-act="redo-miss">不正解だけもう一度</button>`:""}<button class="btn" data-act="redo">同じ条件で最初から</button><button class="btn" data-act="go" data-v="home">ホームへ</button></div>`}

function render(){const v={home,year:vYear,count:vCount,section:vSection,cat:vCat,stats:vStats,quiz:vQuiz,result:vResult}[view];
  const y=window.scrollY;$app.innerHTML=v();if(view==="home"||view==="quiz"||view==="result")window.scrollTo(0,0);else window.scrollTo(0,y)}
function sheetRender(){if(!stack.length){$layer.innerHTML="";return}const st=stack[stack.length-1];
  $layer.innerHTML=`<div class="sheet" data-act="sheet-bg"><div class="in" role="dialog" aria-label="類題"><div class="hd"><button class="back" data-act="sheet-back">${stack.length>1?"‹ 戻る":"閉じる"}</button>${stack.length>1?`<button class="back" data-act="sheet-close">閉じる</button>`:""}</div>
  ${cardHTML(st)}
  ${st.done?`<p class="sub" style="text-align:center">記録しました</p>`:st.rev?`<div class="actions" style="position:static;background:none"><button class="btn ng" data-act="s-ng">✕ 不正解</button><button class="btn ok" data-act="s-ok">○ 正解</button></div>`:`<button class="btn pri" data-act="s-reveal">答えを見る</button>`}</div></div>`}

function toast(ok,t){clearTimeout(toastT);let e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e)}
  e.className="toast "+(ok?"ok":"ng");e.textContent=t;e.hidden=false;toastT=setTimeout(()=>{e.hidden=true},900)}

function begin(label,rebuild){const ids=rebuild();S={label,queue:ids.slice(),i:0,res:[],card:null,rebuild};
  if(!S.queue.length){view="home";render();return}S.card={id:S.queue[0],rev:false};view="quiz";render()}
function advance(){S.i++;if(S.i>=S.queue.length){view="result"}else S.card={id:S.queue[S.i],rev:false};render()}
function grade(ok){const id=S.card.id;record(id,ok);S.res.push({id,ok});toast(ok,ok?"○ 記録しました":"✕ 記録しました");advance()}
const take=(ids,n)=>shuffle(ids).slice(0,n);
const allIds=()=>Q.map(q=>q.id);

document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,d=t.dataset;
  if(a==="sheet-bg"){if(e.target===t){stack=[];sheetRender()}return}
  switch(a){
  case"go":view=d.v;resetArm=false;render();break;
  case"random":begin("ランダム",()=>shuffle(allIds()));break;
  case"year":F.year=d.k;render();break;
  case"start-year":{const y=F.year;begin(yearLabel(y),()=>Q.filter(q=>yearKey(q)===y).map(q=>q.id).sort(cmpId));break}
  case"count":F.count=+d.n;F.custom="";render();break;
  case"start-count":{const n=F.custom?Math.max(1,parseInt(F.custom,10)||1):F.count;begin(Math.min(n,Q.length)+"問ランダム",()=>take(allIds(),n));break}
  case"start-section":{const a1=Math.min(F.from,F.to),b1=Math.max(F.from,F.to),pool=secPool(),n=F.num==="all"?pool.length:+F.num;
    begin("§"+SECS[a1].id+"–§"+SECS[b1].id,()=>take(pool,n));break}
  case"cat":{const c=d.c;begin(c,()=>shuffle(Q.filter(q=>catOf(q)===c).map(q=>q.id)));break}
  case"wrong":{const ids=wrongIds();if(!ids.length){toast(true,"不正解の問題はありません");break}begin("不正解のみ",()=>shuffle(wrongIds()));break}
  case"reveal":S.card.rev=true;render();window.scrollTo(0,0);break;
  case"ok":grade(true);break;case"ng":grade(false);break;
  case"skip":advance();break;
  case"quit":if(S.res.length){view="result";render()}else{view="home";render()}break;
  case"sib":stack.push({id:d.id,rev:false,done:false});sheetRender();break;
  case"open":stack=[{id:d.id,rev:false,done:false}];sheetRender();break;
  case"sheet-back":stack.pop();sheetRender();break;
  case"sheet-close":stack=[];sheetRender();break;
  case"s-reveal":stack[stack.length-1].rev=true;sheetRender();break;
  case"s-ok":case"s-ng":{const st=stack[stack.length-1];record(st.id,a==="s-ok");st.done=true;toast(a==="s-ok",(a==="s-ok"?"○":"✕")+" 記録しました");sheetRender();break}
  case"redo":{const rb=S.rebuild,l=S.label;if(rb().length)begin(l,rb);else{view="home";render()}break}
  case"redo-miss":{const ids=S.res.filter(x=>!x.ok).map(x=>x.id);begin("不正解だけ",()=>shuffle(ids));break}
  case"copy":{const el=document.getElementById("bk");el.select();let p;try{p=navigator.clipboard.writeText(el.value)}catch(_){}
    if(p&&p.then)p.then(()=>toast(true,"コピーしました"),()=>toast(true,"選択しました。コピーしてください"));else toast(true,"選択しました。コピーしてください");break}
  case"import":{try{const o=JSON.parse(document.getElementById("imp").value.trim());if(!o||typeof o.rec!=="object")throw 0;rec=o.rec;log=Array.isArray(o.log)?o.log:[];save();toast(true,"読み込みました");render()}catch(_){toast(false,"形式が正しくありません")}break}
  case"reset":if(!resetArm){resetArm=true;render()}else{rec={};log=[];save();resetArm=false;toast(true,"消去しました");render()}break;
  }});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.bind==="custom"){F.custom=t.value;const b=document.querySelector('[data-act="start-count"]');
  if(b){const n=F.custom?Math.max(1,parseInt(F.custom,10)||1):F.count;b.textContent=Math.min(n,Q.length)+"問をランダムに解く"}
  document.querySelectorAll('[data-act="count"]').forEach(c=>c.classList.toggle("on",!F.custom&&+c.dataset.n===F.count))}});
document.addEventListener("change",e=>{const t=e.target,b=t.dataset.bind;if(!b||b==="custom")return;F[b]=b==="num"?t.value:+t.value;render()});
document.addEventListener("keydown",e=>{if(view!=="quiz"||e.target.matches("input,textarea,select"))return;
  if(!S.card.rev&&(e.key==="Enter"||e.key===" ")){e.preventDefault();S.card.rev=true;render()}
  else if(S.card.rev&&(e.key==="1"||e.key==="o")){grade(true)}else if(S.card.rev&&(e.key==="2"||e.key==="x")){grade(false)}});
render();
})();
</script>
